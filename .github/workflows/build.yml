name: Build IPTV M3U

on:
  schedule:
    # Every Monday at 03:00 UTC (06:00 TR)
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build.js"
      - "lib/**"
      - "test/**"
      - "worker/**"
      - ".github/workflows/build.yml"
      - "package.json"

concurrency:
  group: build-m3u
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test source adapter, build and Worker
        run: npm test

      - name: Clone iptv-org/epg
        run: |
          if [ ! -d external/epg/.git ]; then
            git clone --depth 1 https://github.com/iptv-org/epg.git external/epg
          fi

      - name: Cache iptv-org/epg node_modules
        uses: actions/cache@v4
        with:
          path: external/epg/node_modules
          key: iptvorg-epg-${{ hashFiles('external/epg/package-lock.json') }}

      - name: Install iptv-org/epg deps
        working-directory: external/epg
        run: npm ci --no-audit --no-progress

      # digiturk.com.tr and tvplus.com.tr consistently block GitHub Actions'
      # runner IPs (403 / ECONNRESET / 503 at auth) with 0 programs fetched,
      # so they're dropped to save CI time; epgshare01 already covers those
      # channels as a fallback in scripts/build.js.
      - name: Grab TR EPG (dsmart)
        working-directory: external/epg
        continue-on-error: true
        timeout-minutes: 20
        run: |
          npm run grab --- \
            --sites=dsmart.com.tr \
            --lang=tr \
            --maxConnections=3 \
            --timeout=20000 \
            --delay=500 \
            --output=guides/{site}.xml || true
          ls -la guides/ || true

      # turksatkablo.com.tr serves an incomplete certificate chain ("unable
      # to verify the first certificate"), unrelated to the data itself, so
      # cert verification is disabled only for this read-only public EPG
      # fetch step.
      - name: Grab TR EPG (turksatkablo)
        working-directory: external/epg
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          npm run grab --- \
            --sites=turksatkablo.com.tr \
            --lang=tr \
            --maxConnections=3 \
            --timeout=20000 \
            --delay=500 \
            --output=guides/{site}.xml || true
          ls -la guides/ || true

      - name: Generate iptv.m3u and epg.xml
        env:
          PROXY_BASE: ${{ vars.PROXY_BASE }}
          IPTVORG_GRAB_DIR: external/epg/guides
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain iptv.m3u epg.xml)" ]]; then
            git add iptv.m3u epg.xml
            git commit -m "chore: update iptv.m3u / epg.xml ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in iptv.m3u or epg.xml"
          fi
